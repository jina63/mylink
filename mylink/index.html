<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jina63 | 마이링크</title>
    <style>
      body {
        box-sizing: border-box;
        margin: 0;
        padding: 24px 16px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f3ff;
        color: #29243b;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }

      main {
        box-sizing: border-box;
        width: 100%;
        max-width: 420px;
        padding: 36px 26px;
        border-radius: 20px;
        background: white;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        line-height: 1.3;
      }

      p {
        margin: 0 0 28px;
        color: #716980;
      }

      a {
        display: block;
        padding: 16px;
        border-radius: 12px;
        background: #6d4de0;
        color: white;
        text-decoration: none;
        font-weight: 600;
      }

      a + a {
        margin-top: 12px;
      }

      a:hover,
      a:focus-visible {
        background: #5134b5;
      }

      a:focus-visible {
        outline: 3px solid #5134b5;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>jina63</h1>
      <p>안녕하세요! 제 GitHub와 마이링크 저장소를 모아 두었어요.</p>
      <a href="https://github.com/jina63">GitHub 프로필</a>
      <a href="https://github.com/jina63/mylink">마이링크 저장소</a>
    </main>
  </body>
</html>
